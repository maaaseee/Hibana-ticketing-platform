spring:
  application:
    name: ticketing-app-inventory
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing_db}
    username: ${DB_USER:ticketing_admin}
    password: ${DB_PASSWORD:dev_password_123}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 10000
      pool-name: TicketingHikariPool
  flyway:
    enabled: true
    baseline-on-migrate: true
    table: flyway_inventory_history
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
      jdbc:
        batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always

ticketing:
  lock:
    ttl-seconds: 600
  sweeper:
    expiration:
      enabled: true
      fixed-delay-ms: 5000
      batch-size: 100
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 500
      batch-size: 50
      max-retries: 3
  messaging:
    topics:
      ticket-reservation: ticket.reservation.v1
      event-lifecycle: event.lifecycle.v1
    subscriptions:
      seat-generator: ticketing-seat-generator

spring:
  application:
    name: ticketing-app-inventory
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing_db}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER:ticketing_admin}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 10000
      pool-name: TicketingHikariPool
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_inventory_history
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
      jdbc:
        batch_size: 50
        order_inserts: true
        order_updates: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AZURE_ENTRA_JWKS_URL:http://localhost:4577/00000000-0000-0000-0000-000000000002/discovery/v2.0/keys}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2000ms
      repositories:
        enabled: false

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always

azure:
  servicebus:
    enabled: ${AZURE_SERVICEBUS_ENABLED:false}
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}

ticketing:
  lock:
    ttl-seconds: 600
  sweeper:
    expiration:
      enabled: true
      fixed-delay-ms: 5000
      batch-size: 100
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 500
      batch-size: 50
      max-retries: 3
  messaging:
    topics:
      ticket-reservation: ticket.reservation.v1
      event-lifecycle: event.lifecycle.v1
    subscriptions:
      seat-generator: ticketing-seat-generator

gateway:
  hmac:
    secret: ${GATEWAY_HMAC_SECRET:}

spring:
  application:
    name: ticketing-app-inventory-test
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:ticketing_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: localhost
      port: 6379

ticketing:
  lock:
    ttl-seconds: 600
  sweeper:
    expiration:
      enabled: false
  outbox:
    relay:
      enabled: false
      fixed-delay-ms: 500
      batch-size: 50
      max-retries: 3
  messaging:
    topics:
      ticket-reservation: ticket.reservation.v1
      event-lifecycle: event.lifecycle.v1

services:
  # ---------------------------------------------------------------------------
  # 1. Local Azure Emulator (Cosmos DB, Service Bus, Key Vault, Storage)
  # ---------------------------------------------------------------------------
  floci-az:
    image: floci/floci-az:latest
    container_name: floci-az
    ports:
      - "4577:4577"     # Unified Azure REST API & Cosmos DB Gateway
      - "5673:5673"     # Service Bus AMQP (on-demand emulator)
    environment:
      FLOCI_AZ_STORAGE_MODE: hybrid
      FLOCI_AZ_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_AZ_STORAGE_HYBRID_FLUSH_INTERVAL_MS: 5000
      FLOCI_AZ_STORAGE_WAL_COMPACTION_INTERVAL_MS: 30000
      FLOCI_AZ_SERVICES_REDIS_MOCKED: false
      FLOCI_AZ_SERVICES_SERVICE_BUS_MOCKED: false
      FLOCI_AZ_SERVICES_SERVICE_BUS_START_ON_BOOT: true
      FLOCI_AZ_SERVICES_SERVICEBUS_MOCKED: false
      FLOCI_AZ_HOSTNAME: localhost
      FLOCI_AZ_BASE_URL: http://localhost:4577
      FLOCI_AZ_SERVICES_ENTRA_SEED_FILE: /app/config/entra-seed.json
    volumes:
      - ${USERPROFILE:-~}/.floci-studio/data:/app/data
      - ./infra/local-dev/entra-seed.json:/app/config/entra-seed.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - ticketing-net

  # ---------------------------------------------------------------------------
  # 2. Azure Database for PostgreSQL (Flexible Server) + pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ticketing-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ticketing_db
      POSTGRES_USER: ticketing_admin
      POSTGRES_PASSWORD: dev_password_123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local-dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing_admin -d ticketing_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ticketing-net

  # ---------------------------------------------------------------------------
  # 3. Azure Cache for Redis (Redlock, Waiting Room, & PubSub)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ticketing-net

  # ---------------------------------------------------------------------------
  # 4. Mailpit: Zero-Cost Local SMTP Server & Mailbox Inspector
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: ticketing-mailpit
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI for email & attachment inspection
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    command: ["--smtp-auth-allow-insecure"]
    restart: unless-stopped
    networks:
      - ticketing-net

  # ---------------------------------------------------------------------------
  # 5. Catalog Service (Events, Venues, Schedules)
  # ---------------------------------------------------------------------------
  catalog:
    build:
      context: ./ticketing-app-catalog
      dockerfile: Dockerfile
    container_name: ticketing-catalog
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ticketing_admin
      DB_PASSWORD: dev_password_123
      DB_NAME: ticketing_db
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AZURE_SERVICEBUS_ENABLED: "true"
      AZURE_SERVICEBUS_CONNECTION_STRING: Endpoint=sb://floci-az:5673;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=devkey;UseDevelopmentEmulator=true;
      AZURE_BLOB_ENABLED: "true"
      AZURE_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://floci-az:4577/devstoreaccount1;"
      AZURE_BLOB_CONTAINER_NAME: "hibana-invoices" 
      AZURE_ENTRA_JWKS_URL: "http://floci-az:4577/00000000-0000-0000-0000-000000000002/discovery/v2.0/keys"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci-az:
        condition: service_started
    restart: unless-stopped
    networks:
      - ticketing-net

  # ---------------------------------------------------------------------------
  # 6. Inventory Service (Seat Locking, Redlock, Capacities)
  # ---------------------------------------------------------------------------
  inventory:
    build:
      context: ./ticketing-app-inventory
      dockerfile: Dockerfile
    container_name: ticketing-inventory
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ticketing_admin
      DB_PASSWORD: dev_password_123
      DB_NAME: ticketing_db
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AZURE_SERVICEBUS_ENABLED: "true"
      AZURE_SERVICEBUS_CONNECTION_STRING: Endpoint=sb://floci-az:5673;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=devkey;UseDevelopmentEmulator=true;
      AZURE_BLOB_ENABLED: "true"
      AZURE_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://floci-az:4577/devstoreaccount1;"
      AZURE_BLOB_CONTAINER_NAME: "hibana-invoices" 
      AZURE_ENTRA_JWKS_URL: "http://floci-az:4577/00000000-0000-0000-0000-000000000002/discovery/v2.0/keys"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci-az:
        condition: service_started
    restart: unless-stopped
    networks:
      - ticketing-net

  # ---------------------------------------------------------------------------
  # 7. Orders & Financial Service (Checkout, PDF Invoices, Mailer)
  # ---------------------------------------------------------------------------
  orders:
    build:
      context: ./ticketing-app-orders
      dockerfile: Dockerfile
    container_name: ticketing-orders
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ticketing_admin
      DB_PASSWORD: dev_password_123
      DB_NAME: ticketing_db
      SPRING_FLYWAY_BASELINE_VERSION: "0"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AZURE_SERVICEBUS_ENABLED: "true"
      AZURE_SERVICEBUS_CONNECTION_STRING: Endpoint=sb://floci-az:5673;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=devkey;UseDevelopmentEmulator=true;
      AZURE_BLOB_ENABLED: "true"
      AZURE_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://floci-az:4577/devstoreaccount1;"
      AZURE_BLOB_CONTAINER_NAME: "hibana-invoices" 
      AZURE_ENTRA_JWKS_URL: "http://floci-az:4577/00000000-0000-0000-0000-000000000002/discovery/v2.0/keys"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      floci-az:
        condition: service_started
    restart: unless-stopped
    networks:
      - ticketing-net

  # ---------------------------------------------------------------------------
  # 8. Spring Cloud Gateway (Waiting Room Token Gating, Rate Limiting, CoreDNS)
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./ticketing-app-gateway
      dockerfile: Dockerfile
    container_name: ticketing-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CATALOG_SERVICE_URL: http://catalog:8081
      INVENTORY_SERVICE_URL: http://inventory:8082
      ORDERS_SERVICE_URL: http://orders:8083
      AZURE_KEYVAULT_ENABLED: "true"
      AZURE_KEYVAULT_ENDPOINT: "http://floci-az:4577/devstoreaccount1-keyvault/" 
      AZURE_ENTRA_JWKS_URL: "http://floci-az:4577/00000000-0000-0000-0000-000000000002/discovery/v2.0/keys"
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      orders:
        condition: service_started
    restart: unless-stopped
    networks:
      - ticketing-net

  # ---------------------------------------------------------------------------
  # 9. Frontend Client (Vue 3 / Vite B2C Portal)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./ticketing-frontend
      dockerfile: Dockerfile
    container_name: ticketing-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_GATEWAY_URL: http://gateway:8080
    volumes:
      - ./ticketing-frontend/src:/app/src
      - ./ticketing-frontend/public:/app/public
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - ticketing-net


volumes:
  postgres-data:
  redis-data:

networks:
  ticketing-net:
    driver: bridge

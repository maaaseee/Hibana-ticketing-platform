plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aieta.ticketing_app_gateway'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.2")
    set('jjwtVersion', "0.12.6")
    set('wiremockVersion', "3.10.0")
}

configurations.configureEach {
    // Strictly prohibit blocking servlet / Tomcat dependencies
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-webmvc'
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    exclude group: 'org.apache.tomcat.embed', module: 'tomcat-embed-core'
}

dependencies {
    // Azure Key Vault & Identity
    implementation 'com.azure:azure-security-keyvault-secrets:4.9.1'
    implementation 'com.azure:azure-identity:1.14.1'
    // 1. Reactive API Gateway Core (WebFlux Netty runtime)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // 2. Distributed Rate Limiting via Redis Reactive Token Bucket
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // 3. Actuator & Observability
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 4. Circuit Breaker (Resilience4j Reactor)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // 5. JWT Validation for X-Checkout-Token (Virtual Waiting Room pass)
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing Suite
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webtestclient'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}

tasks.named('test') {
    useJUnitPlatform()
}

spring:
  application:
    name: catalog-service
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing_db}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER:ticketing_admin}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: CatalogHikariPool
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_catalog_history
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AZURE_ENTRA_JWKS_URL:http://localhost:4577/00000000-0000-0000-0000-000000000002/discovery/v2.0/keys}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      repositories:
        enabled: false

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

azure:
  servicebus:
    enabled: ${AZURE_SERVICEBUS_ENABLED:false}
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}

catalog:
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 500
      batch-size: 50
      max-retries: 3
  messaging:
    topics:
      event-lifecycle: event.lifecycle.v1
  azure:
    storage:
      blob:
        endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT:http://localhost:4577/devstoreaccount1}
        container: ${AZURE_STORAGE_VENUES_CONTAINER:venues}
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}

gateway:
  hmac:
    secret: ${GATEWAY_HMAC_SECRET:}



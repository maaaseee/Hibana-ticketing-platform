<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sala de Espera - Amaryllis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;family=Space+Grotesk:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "background": "#0c141f",
                "surface": "#0c141f",
                "surface-container": "#141c27",
                "surface-container-high": "#1b2533",
                "surface-container-highest": "#23354d",
                "surface-container-lowest": "#070f19",
                "primary": "#86cffb",
                "primary-container": "#00688f",
                "on-primary": "#00344a",
                "on-primary-container": "#b7e2ff",
                "secondary": "#4fdbc8",
                "outline": "#899299",
                "outline-variant": "#23354d",
                "on-surface": "#f1f5f9",
                "on-surface-variant": "#94a3b8"
              },
              "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "full": "9999px"
              },
              "spacing": {
                "margin-mobile": "1rem",
                "margin-desktop": "2.5rem",
                "xs": "0.5rem",
                "sm": "0.75rem",
                "md": "1rem",
                "lg": "1.5rem",
                "xl": "2.5rem"
              },
              "fontFamily": {
                "body-md": ["Hanken Grotesk"],
                "body-lg": ["Hanken Grotesk"],
                "display": ["Space Grotesk"],
                "label-sm": ["JetBrains Mono"],
                "label-md": ["JetBrains Mono"]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 12s linear infinite;
        }
    </style>
</head>
<body class="bg-[#0c141f] text-[#f1f5f9] font-body-md antialiased overflow-hidden w-screen h-screen selection:bg-[#00688f] selection:text-white">
<!-- Background Layer (Subtle dark event concert backdrop) -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-cover bg-center opacity-20 blur-2xl scale-110" data-alt="A massive concert stadium view with stage lighting in deep cool tones." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD5JARa5f_yWIviQozhl8UL8ZuqOAFJwmrkCAOmbq_NScyHHzLRQkazaYJbdY8GePpoPMYKYJk0MkcpwowOws4_KsgDbgYv0AxNcjf6Z5rm3ZO94HrGM7eipRLKt-vE3RPWiAzyMwmhecVhiOv7aEQXm2vUCP7YeZn305SEk7t8p3pJfm5nMZ0JZHnc16rWTdKBY3ZtY2dHnyWQEdAJCTKxhKep13SE6czpOaSKkhCCKbcBxMqE12KmLQ')"></div>
<!-- Deep navy vignette overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-[#0c141f]/90 via-[#0c141f]/95 to-[#0c141f]"></div>
</div>
<!-- Main Overlay Container -->
<main class="relative z-10 w-full h-full flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Header / Brand (Minimalist Dark Blue) -->
<div class="absolute top-margin-mobile md:top-margin-desktop left-margin-mobile md:left-margin-desktop flex items-center gap-2">
<span class="font-display text-2xl font-bold text-[#86cffb] tracking-tight">Amaryllis</span>
<span class="w-1.5 h-1.5 rounded-full bg-[#00688f]"></span>
<span class="font-label-sm text-xs text-[#94a3b8] uppercase tracking-wider font-medium">Queue System</span>
</div>
<!-- Waiting Room Content Box -->
<div class="bg-[#141c27] border border-[#23354d] rounded-2xl p-6 md:p-10 flex flex-col items-center max-w-lg w-full text-center shadow-[0px_8px_32px_rgba(0,0,0,0.45)]">
<!-- Icon/Status Indicator (Solid flat styling with crisp border) -->
<div class="w-14 h-14 rounded-full bg-[#1b2533] border border-[#23354d] flex items-center justify-center mb-5">
<span class="material-symbols-outlined text-[#86cffb] text-[28px]">hourglass_empty</span>
</div>
<h1 class="font-display text-2xl md:text-3xl font-bold text-[#f1f5f9] mb-2 tracking-tight">
    Estás en la fila
</h1>
<p class="font-body-md text-base text-[#94a3b8] mb-8">
    Por favor no cierres ni actualices esta página.
</p>
<!-- Circular Progress / Status Area -->
<div class="relative w-56 h-56 flex items-center justify-center mb-8">
<!-- Clean solid rings without glow or blur -->
<div class="absolute inset-0 rounded-full border border-[#23354d]"></div>
<div class="absolute inset-3 rounded-full border border-dashed border-[#23354d]/70 animate-spin-slow" style="animation-direction: reverse;"></div>
<div class="absolute inset-0 rounded-full border-2 border-t-[#00688f] border-r-[#00688f] border-b-transparent border-l-transparent animate-spin-slow"></div>
<!-- Center Status Info -->
<div class="relative z-10 flex flex-col items-center">
<span class="font-label-sm text-xs text-[#94a3b8] uppercase tracking-widest mb-1 font-semibold">Tu posición</span>
<span class="font-display text-4xl md:text-5xl font-extrabold text-[#f1f5f9] tabular-nums tracking-tight">
    4,500
</span>
</div>
</div>
<!-- Estimated Time Footer -->
<div class="w-full bg-[#1b2533] border border-[#23354d] flex flex-col items-center py-3.5 px-4 rounded-xl">
<div class="flex items-center gap-2 text-[#f1f5f9]">
<span class="material-symbols-outlined text-[18px] fill text-[#86cffb]">schedule</span>
<span class="font-label-md text-sm font-medium text-[#cbd5e1]">Tiempo estimado: <strong class="text-[#86cffb] font-semibold">4 min</strong></span>
</div>
<div class="mt-2.5 w-full max-w-[220px] h-1.5 bg-[#0c141f] border border-[#23354d]/60 rounded-full overflow-hidden">
<div class="h-full bg-[#00688f] rounded-full w-2/5"></div>
</div>
</div>
</div>
<!-- Trust / Info Footer -->
<div class="absolute bottom-margin-mobile md:bottom-margin-desktop w-full flex justify-center text-center px-margin-mobile">
<p class="font-label-sm text-xs text-[#94a3b8]/80 max-w-md leading-relaxed">
    Protegido por el sistema de colas de alta disponibilidad de Amaryllis. Las asignaciones de asientos son definitivas una vez iniciado el pago.
</p>
</div>
</main>
</body></html>

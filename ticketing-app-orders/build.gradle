plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aieta.ticketing_app_orders'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.2")
    set('awaitilityVersion', "4.2.2")
}

dependencies {
    // 1. Web, Validation & Actuator
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // 2. Relational Persistence & Flyway Migrations
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // 3. Distributed Caching & Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 4. Synchronous Inter-Service Communication (OpenFeign + Resilience4j)
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // 5. Jackson Serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // 6. Azure Cloud Ecosystem & Messaging (Service Bus, Blob Storage, Key Vault)
    implementation 'com.azure:azure-messaging-servicebus:7.17.7'
    implementation 'com.azure:azure-storage-blob:12.28.1'
    implementation 'com.azure:azure-security-keyvault-secrets:4.9.1'
    implementation 'com.azure:azure-identity:1.14.1'

    // 7. Transactional Emailing (Mailpit / SMTP / Azure ACS ready)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 8. PDF Generation (OpenPDF) & QR Code Generation (ZXing)
    implementation 'com.github.librepdf:openpdf:2.0.3'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 7. Testing Suite
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.awaitility:awaitility:${awaitilityVersion}"
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.platform:junit-platform-suite'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}

tasks.named('test') {
    useJUnitPlatform()
}

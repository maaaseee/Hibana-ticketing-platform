server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: ticketing-app-orders
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing_db}
    username: ${DB_USER:ticketing_admin}
    password: ${DB_PASSWORD:dev_password_123}
    hikari:
      schema: orders
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      pool-name: OrdersHikariPool
  flyway:
    enabled: true
    schemas: orders
    default-schema: orders
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

ticketing:
  outbox:
    relay:
      enabled: true
      batch-size: 50
      fixed-delay-ms: 500
      max-retries: 3
  messaging:
    topics:
      order-lifecycle: order.lifecycle.v1
      ticket-reservation: ticket.reservation.v1
  inventory:
    service-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: false

logging:
  level:
    root: INFO
    com.aieta.ticketing_app_orders: DEBUG
    org.flywaydb: INFO

hibana:
  mailing:
    provider: ${MAILING_PROVIDER:smtp}
    from-email: ${MAILING_FROM_EMAIL:no-reply@hibana.tk}
    from-name: "Hibana.tk Entradas"
  azure:
    communication:
      endpoint: ${AZURE_COMMUNICATION_ENDPOINT:}

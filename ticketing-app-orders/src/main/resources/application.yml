server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: ticketing-app-orders
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.amqp.RabbitHealthContributorAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing_db}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER:ticketing_admin}
    password: ${DB_PASSWORD:}
    hikari:
      schema: orders
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      pool-name: OrdersHikariPool
  flyway:
    enabled: true
    schemas: orders
    default-schema: orders
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AZURE_ENTRA_JWKS_URL:http://localhost:4577/00000000-0000-0000-0000-000000000002/discovery/v2.0/keys}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2000ms
      repositories:
        enabled: false

ticketing:
  outbox:
    relay:
      enabled: true
      batch-size: 50
      fixed-delay-ms: 500
      max-retries: 3
  messaging:
    topics:
      order-lifecycle: order.lifecycle.v1
      ticket-reservation: ticket.reservation.v1
  inventory:
    service-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.aieta.ticketing_app_orders: DEBUG
    org.flywaydb: INFO

azure:
  servicebus:
    enabled: ${AZURE_SERVICEBUS_ENABLED:false}
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
  storage:
    blob:
      enabled: ${AZURE_BLOB_ENABLED:false}
      connection-string: ${AZURE_BLOB_CONNECTION_STRING:}
      container-name: ${AZURE_BLOB_CONTAINER_NAME:hibana-invoices}
  keyvault:
    enabled: ${AZURE_KEYVAULT_ENABLED:false}
    endpoint: ${AZURE_KEYVAULT_ENDPOINT:}

hibana:
  mailing:
    provider: ${MAILING_PROVIDER:smtp}
    from-email: ${MAILING_FROM_EMAIL:no-reply@hibana.tk}
    from-name: "Hibana.tk Entradas"
  azure:
    communication:
      endpoint: ${AZURE_COMMUNICATION_ENDPOINT:}

payment:
  methods:
    debit-card:
      enabled: ${PAYMENT_DEBIT_ENABLED:true}
    credit-card:
      enabled: ${PAYMENT_CREDIT_ENABLED:true}
    mercado-pago:
      enabled: ${PAYMENT_MERCADOPAGO_ENABLED:false}

mercadopago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
  public-key: ${MERCADO_PAGO_PUBLIC_KEY:}
  webhook:
    secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
  back-url-success: ${MERCADO_PAGO_BACK_URL_SUCCESS:http://localhost:5173/checkout/success}
  back-url-failure: ${MERCADO_PAGO_BACK_URL_FAILURE:http://localhost:5173/checkout/failure}
  back-url-pending: ${MERCADO_PAGO_BACK_URL_PENDING:http://localhost:5173/checkout/pending}
  notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:http://localhost:8080/api/v1/payments/mercadopago/webhook}

gateway:
  hmac:
    secret: ${GATEWAY_HMAC_SECRET:}

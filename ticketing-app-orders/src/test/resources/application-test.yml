spring:
  application:
    name: ticketing-app-orders-test
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:orders_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS orders
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: orders
        format_sql: false
  data:
    redis:
      host: localhost
      port: 6379

ticketing:
  outbox:
    relay:
      enabled: false
  messaging:
    topics:
      order-lifecycle: order.lifecycle.v1
      ticket-reservation: ticket.reservation.v1
  inventory:
    service-url: http://localhost:8082

payment:
  methods:
    debit-card:
      enabled: true
    credit-card:
      enabled: true
    mercado-pago:
      enabled: true

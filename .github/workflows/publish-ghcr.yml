name: Build & Publish Container Images to GHCR

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ticketing-app-gateway/**'
      - 'ticketing-app-catalog/**'
      - 'ticketing-app-inventory/**'
      - 'ticketing-app-orders/**'
      - 'ticketing-frontend/**'
      - 'ticketing-admin/**'
      - '.github/workflows/publish-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: ticketing-gateway
            context: ./ticketing-app-gateway
            dockerfile: ./ticketing-app-gateway/Dockerfile
          - name: ticketing-catalog
            context: ./ticketing-app-catalog
            dockerfile: ./ticketing-app-catalog/Dockerfile
          - name: ticketing-inventory
            context: ./ticketing-app-inventory
            dockerfile: ./ticketing-app-inventory/Dockerfile
          - name: ticketing-orders
            context: ./ticketing-app-orders
            dockerfile: ./ticketing-app-orders/Dockerfile
          - name: ticketing-frontend
            context: ./ticketing-frontend
            dockerfile: ./ticketing-frontend/Dockerfile.prod
          - name: ticketing-admin
            context: ./ticketing-admin
            dockerfile: ./ticketing-admin/Dockerfile.prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize Repository Owner to Lowercase
        id: owner
        run: |
          echo "lowercase_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push ${{ matrix.service.name }} to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Hibana.tk ${{ matrix.service.name }} container image
          tags: |
            ghcr.io/${{ steps.owner.outputs.lowercase_owner }}/${{ matrix.service.name }}:latest
            ghcr.io/${{ steps.owner.outputs.lowercase_owner }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

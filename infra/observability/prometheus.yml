global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'hibana-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080', 'host.docker.internal:8080']
        labels:
          service: 'ticketing-gateway'

  - job_name: 'hibana-catalog'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['catalog:8081', 'host.docker.internal:8081']
        labels:
          service: 'ticketing-catalog'

  - job_name: 'hibana-inventory'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory:8082', 'host.docker.internal:8082']
        labels:
          service: 'ticketing-inventory'

  - job_name: 'hibana-orders'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['orders:8083', 'host.docker.internal:8083']
        labels:
          service: 'ticketing-orders'

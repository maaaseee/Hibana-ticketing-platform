apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hibana-platform-ingress
  namespace: hibana-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Enable WebSocket & SSE streaming for Virtual Waiting Room & Support Live Chat
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.hibana.tk
        - admin.hibana.tk
        - api.hibana.tk
      secretName: hibana-tls-cert
  rules:
    # 1. API Gateway Perimeter (REST, SSE Queue Stream & WebSockets)
    - host: api.hibana.tk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketing-gateway
                port:
                  number: 8080

    # 2. Front-Office B2C Public Client
    - host: www.hibana.tk
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ticketing-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketing-frontend
                port:
                  number: 80

    # 3. Back-Office B2B Admin & Operations Portal (Isolated Host)
    - host: admin.hibana.tk
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ticketing-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketing-admin
                port:
                  number: 80

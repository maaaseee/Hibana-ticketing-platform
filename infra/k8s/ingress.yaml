apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hibana-platform-ingress
  namespace: hibana-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Enable WebSocket & SSE streaming for Virtual Waiting Room & Support Live Chat
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    # Default hostless rule: accepts Azure Free DNS (*.cloudapp.azure.com), nip.io, or Public LoadBalancer IP
    - http:
        paths:
          # 1. API Gateway Perimeter (REST APIs)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ticketing-gateway
                port:
                  number: 8080
          # 2. Live Support Chat WebSockets
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: ticketing-gateway
                port:
                  number: 8080
          # 3. Front-Office B2C Public Client (SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketing-frontend
                port:
                  number: 80

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: hibana-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-edge
  namespace: hibana-prod
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: ["ticketing-gateway", "ticketing-frontend", "ticketing-admin"] }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backend
  namespace: hibana-prod
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: ["ticketing-catalog", "ticketing-inventory", "ticketing-orders"] }
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming traffic strictly from Gateway pods
    - from:
        - podSelector:
            matchLabels:
              app: ticketing-gateway
      ports:
        - protocol: TCP
          port: 8081 # Catalog
        - protocol: TCP
          port: 8082 # Inventory
        - protocol: TCP
          port: 8083 # Orders
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orders-to-inventory
  namespace: hibana-prod
spec:
  podSelector:
    matchLabels:
      app: ticketing-inventory
  policyTypes:
    - Ingress
  ingress:
    # Allow synchronous Saga settlement communication from orders service to inventory
    - from:
        - podSelector:
            matchLabels:
              app: ticketing-orders
      ports:
        - protocol: TCP
          port: 8082

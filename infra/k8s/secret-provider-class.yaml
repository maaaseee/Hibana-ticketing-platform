apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-secrets-provider
  namespace: hibana-prod
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${AZURE_WORKLOAD_IDENTITY_CLIENT_ID}" # Workload Identity Client ID
    keyvaultName: "${AZURE_KEYVAULT_NAME}"          # Name of the Azure Key Vault
    tenantId: "${AZURE_TENANT_ID}"                  # Azure Tenant ID
    cloudName: ""                                   # Defaults to AzurePublicCloud
    objects: |
      array:
        - |
          objectName: waiting-room-jwt-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: gateway-hmac-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: mercadopago-webhook-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: postgres-admin-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: redis-password
          objectType: secret
          objectVersion: ""

  # Synchronize CSI secrets into native Kubernetes Secret objects
  secretObjects:
    - secretName: hibana-secrets
      type: Opaque
      data:
        - objectName: waiting-room-jwt-secret
          key: WAITING_ROOM_JWT_SECRET
        - objectName: gateway-hmac-secret
          key: GATEWAY_HMAC_SECRET
        - objectName: mercadopago-webhook-secret
          key: MERCADO_PAGO_WEBHOOK_SECRET
        - objectName: postgres-admin-password
          key: DB_PASSWORD
        - objectName: redis-password
          key: REDIS_PASSWORD

<!DOCTYPE html>
<html class="dark" lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hibana.tk | Plataforma Oficial de Entradas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  </head>
  <body class="bg-surface text-on-surface font-body antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen">
    <div id="app">
      <div id="app-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#0c141f;color:#dbe3f3;z-index:99999;font-family:'Space Grotesk',sans-serif;">
        <div style="position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
          <div style="position:absolute;inset:-12px;border-radius:50%;background:radial-gradient(circle,rgba(134,207,251,0.25) 0%,transparent 70%);animation:pulseGlow 2s infinite ease-in-out;"></div>
          <img src="/logo.png" alt="Hibana.tk" style="width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(134,207,251,0.5));animation:floatLogo 3s infinite ease-in-out;" />
        </div>
        <div style="font-size:24px;font-weight:900;letter-spacing:-0.03em;color:#86cffb;margin-bottom:6px;">HIBANA.TK</div>
        <div style="font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:0.18em;text-transform:uppercase;color:#94a3b8;margin-bottom:24px;">Plataforma Oficial de Entradas</div>
        <div style="width:140px;height:3px;background-color:#1c2e48;border-radius:999px;overflow:hidden;position:relative;">
          <div style="position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#86cffb,#4fdbc8,transparent);border-radius:999px;animation:slideLoader 1.4s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes pulseGlow{0%,100%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.25);opacity:1;}}
          @keyframes floatLogo{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
          @keyframes slideLoader{0%{left:-40%;}100%{left:100%;}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
